<!-- Add this modal HTML right before closing </body> tag in returnBookList.html -->

<!-- Confirmation Modal -->
<div id="returnModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Return Book</h2>
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="book-info">
                <div class="book-icon">📚</div>
                <div>
                    <p class="modal-book-title" id="modalBookTitle"></p>
                    <p class="modal-book-author" id="modalBookAuthor"></p>
                </div>
            </div>
            <p class="confirm-message">Are you sure you want to return this book?</p>
            <p class="fine-notice" id="fineNotice" style="display: none;">
                ⚠️ Fine Amount: ₹<span id="fineAmount"></span>
            </p>
        </div>
        <div class="modal-footer">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <form id="returnForm" method="POST" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="confirm-btn">Yes, Return Book</button>
            </form>
        </div>
    </div>
</div>

<style>
/* Modal Styles */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal-content {
    background: var(--beige-light);
    margin: 10% auto;
    border-radius: 16px;
    max-width: 500px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    animation: slideDown 0.3s ease;
}

@keyframes slideDown {
    from {
        transform: translateY(-50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.modal-header {
    padding: 24px 28px;
    border-bottom: 2px solid var(--border-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    color: var(--brown-dark);
    font-size: 22px;
    margin: 0;
}

.close-btn {
    color: var(--text-muted);
    font-size: 32px;
    font-weight: 300;
    cursor: pointer;
    transition: color 0.3s;
    line-height: 1;
}

.close-btn:hover {
    color: var(--brown-dark);
}

.modal-body {
    padding: 28px;
}

.book-info {
    display: flex;
    align-items: center;
    gap: 16px;
    background: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.book-icon {
    font-size: 40px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    width: 60px;
    height: 60px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-book-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--brown-dark);
    margin-bottom: 4px;
}

.modal-book-author {
    font-size: 14px;
    color: var(--text-muted);
}

.confirm-message {
    font-size: 15px;
    color: var(--text-main);
    margin-bottom: 12px;
}

.fine-notice {
    background: #fff3e0;
    color: #f57c00;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    border-left: 4px solid #ff9800;
}

.modal-footer {
    padding: 20px 28px;
    border-top: 2px solid var(--border-soft);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
}

.cancel-btn {
    padding: 10px 24px;
    background: var(--beige-medium);
    color: var(--brown-soft);
    border: 2px solid var(--border-soft);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.cancel-btn:hover {
    background: var(--border-soft);
    transform: translateY(-2px);
}

.confirm-btn {
    padding: 10px 24px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.confirm-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}
</style>

<script>
function openReturnModal(issueId, bookTitle, bookAuthor, fine) {
    // Set book details in modal
    document.getElementById('modalBookTitle').textContent = bookTitle;
    document.getElementById('modalBookAuthor').textContent = 'by ' + bookAuthor;
    
    // Show fine notice if there's a fine
    if (fine > 0) {
        document.getElementById('fineAmount').textContent = fine;
        document.getElementById('fineNotice').style.display = 'block';
    } else {
        document.getElementById('fineNotice').style.display = 'none';
    }
    
    // Set form action
    document.getElementById('returnForm').action = '/returnBook/' + issueId + '/';
    
    // Show modal
    document.getElementById('returnModal').style.display = 'block';
}

function closeModal() {
    document.getElementById('returnModal').style.display = 'none';
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById('returnModal');
    if (event.target === modal) {
        closeModal();
    }
}

// Close modal on Escape key
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closeModal();
    }
});
</script>
