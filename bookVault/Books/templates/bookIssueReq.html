<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Issue Requests</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #3b2a2a, #2a1e1e);
            color: #2b1e17;
            min-height: 100vh;
            padding: 40px;
        }

        .page-title {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            color: #f1e3c8;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #cbb8a0;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .requests-container {
            background: #e6d4b8;
            border-radius: 20px;
            padding: 28px;
            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255,255,255,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6a5846;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        tbody tr {
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 16px 0;
            font-size: 14px;
            color: #2b1e17;
        }

        .student-name {
            font-weight: 600;
        }

        .book-title {
            font-style: italic;
            color: #3a2921;
        }

        .request-date {
            color: #6b5a48;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .approve {
            background: #6f8f72;
            color: #ffffff;
        }

        .reject {
            background: #b66a4a;
            color: #ffffff;
        }

        .status {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .pending {
            background: #d9c6a5;
            color: #5a4534;
        }
    </style>
</head>

<body>

    <h1 class="page-title">Book Issue Requests</h1>
    <p class="page-subtitle">Review and manage pending book issue requests</p>

    <div class="requests-container">
        <table>
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Book</th>
                    <th>Requested On</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>

                <tr>
                    <td class="student-name">Rahul Singh</td>
                    <td class="book-title">Atomic Habits</td>
                    <td class="request-date">18 Jan 2026</td>
                    <td><span class="status pending">Pending</span></td>
                    <td>
                        <div class="actions">
                            <button class="btn approve">Approve</button>
                            <button class="btn reject">Reject</button>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td class="student-name">Ananya Patel</td>
                    <td class="book-title">Deep Work</td>
                    <td class="request-date">17 Jan 2026</td>
                    <td><span class="status pending">Pending</span></td>
                    <td>
                        <div class="actions">
                            <button class="btn approve">Approve</button>
                            <button class="btn reject">Reject</button>
                        </div>
                    </td>
                </tr>

            </tbody>
        </table>
    </div>

</body>
</html>
