{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHub - Signup</title>
    <link rel="stylesheet" href="{% static 'css/loginPage.css' %}">
</head>

<body>
    <div class="container">
        <div class="background"></div>
        <div class="overlay"></div>
        
        <div class="contents">

            <div class="navbar">
                <h1>BookVault</h1>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>
            
            <div class="signup-form">

                <form class="login-card" onsubmit="handleSignup(event)">
                    <div class="logo-section">
                        <div class="logo-icon">BV</div>
                        <div class="logo-text">
                            <h1>BookVault</h1>
                            <p>Library Management</p>
                        </div>
                    </div>
        
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required>
                    </div>

                    <div class="role">
                        <label for="role">Select Role:</label>
                        <select id="role" name="role" required>
                            <option value="" disabled selected>Select your role</option>
                            <option value="reader">Reader</option>
                            <option value="librarian">Librarian</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
        
                    <div class="form-group">
                        <label for="password">Create Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
        
                    <!-- <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div> -->
        
                    <button type="submit" class="login-btn">Sign Up</button>
        
                    <div class="signup-section">
                        <p>Don't have an account? <a href="#" class="signup-link">Create One</a></p>
                    </div>
        
                    <!-- <div class="social-login">
                        <button type="button" class="social-btn">Google</button>
                        <button type="button" class="social-btn">GitHub</button>
                    </div> -->
                </form>
            </div>
        </div>

    </div>
</body>

</html>
